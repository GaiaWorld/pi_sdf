<!DOCTYPE html>
<html>

<head> 
    <meta charset="utf-8"> 
    <title>菜鸟教程(runoob.com)</title> 
</head>

<style type="text/css">
    @font-face {
        font-family: "MyFont";
        src:
            url("source/msyh.ttf");
    }
</style>

<body>

    <canvas id="myCanvas" width="512" height="512" style="border:1px solid #ff0000;">
        您的浏览器不支持 HTML5 canvas 标签。</canvas>

    <script>

        var c = document.getElementById("myCanvas");
        let width = c.width;
        let height = c.height;
        let gl = c.getContext("webgl2");

        const testFBO = gl.createFramebuffer();
        const depthTex = gl.createTexture();

        gl.bindFramebuffer(gl.FRAMEBUFFER, testFBO);

        // 2. 创建并附加一个最简化的颜色附件（可选但推荐，某些驱动需要）
        const colorTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, colorTex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        // 设置必要的纹理参数，防止采样时出错
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, colorTex, 0);

        // // 3. 【核心】创建并附加深度纹理
        gl.bindTexture(gl.TEXTURE_2D, depthTex);

        // 使用最广泛支持的格式：DEPTH_COMPONENT + UNSIGNED_SHORT
        // 注意：在WebGL 2.0中，可以尝试 gl.DEPTH_COMPONENT24 以获得更高精度
        gl.texImage2D(
            gl.TEXTURE_2D,
            0,
            gl.DEPTH_COMPONENT32F, // 内部格式：使用基础格式，兼容性最好
            width, // 宽度，必须与颜色附件相同
            height, // 高度
            0,
            gl.DEPTH_COMPONENT, // 格式
            gl.FLOAT,  // 类型：32位浮点数，支持最广泛
            null // 只分配空间，不传入数据
        );
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        // 防止深度纹理被采样时返回“超出[0,1]范围”的错误（某些平台需要）
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, depthTex, 0);

        // 4. 检查状态并尝试清空
        const fboStatus = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
        console.log(`深度纹理FBO状态: ${fboStatus} (${fboStatus === gl.FRAMEBUFFER_COMPLETE ? 'COMPLETE' : 'INCOMPLETE'})`);

        // 先设置视口匹配FBO尺寸
        gl.viewport(0, 0, width, height);

        gl.clear(gl.DEPTH_BUFFER_BIT);
        console.log("清空深度纹理附件: err: ", gl.getError());

    </script>


</body>


</html>
